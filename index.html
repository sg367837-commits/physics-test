<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGS Bhojpur - VVI Objective Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 30px; }
        header { width: 100%; background: #2563eb; color: white; padding: 18px 20px; text-align: center; }
        header h1 { font-size: 1.25rem; font-weight: 800; }
        .container { width: 100%; max-width: 540px; padding: 16px; }
        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 14px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 1rem; outline: none; }
        .form-control:focus { border-color: #2563eb; }
        /* Real Button Styling */
        button.subject-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 16px; background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px; margin-bottom: 12px; cursor: pointer; text-align: left; }
        button.subject-btn:active { background: #dbeafe; border-color: #2563eb; }
        .subject-btn .info h3 { font-size: 1rem; font-weight: 700; color: #0f172a; }
        .subject-btn .info p { font-size: 0.8rem; color: #64748b; margin-top: 2px; }
        .subject-btn .arrow { width: 32px; height: 32px; background: #2563eb; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .quiz-header { display: flex; justify-content: space-between; margin-bottom: 14px; font-weight: bold; }
        .progress-bar-wrap { width: 100%; height: 6px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
        .progress-bar { height: 100%; width: 2%; background: #2563eb; }
        .q-text { font-size: 1.05rem; font-weight: 700; line-height: 1.5; margin-bottom: 18px; }
        .opt-btn { width: 100%; display: flex; align-items: center; padding: 12px 14px; background: white; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; cursor: pointer; text-align: left; }
        .opt-btn .opt-badge { width: 28px; height: 28px; background: #e2e8f0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; margin-right: 12px; }
        .opt-btn.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }
        .opt-btn.correct .opt-badge { background: #22c55e; color: white; }
        .opt-btn.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        .opt-btn.wrong .opt-badge { background: #ef4444; color: white; }
        .scorecard { background: white; border: 3px solid #2563eb; border-radius: 16px; padding: 20px; text-align: center; }
        .score-circle { width: 100px; height: 100px; border-radius: 50%; background: #eff6ff; border: 4px solid #2563eb; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 16px auto; font-size: 2rem; font-weight: 800; color: #2563eb; }
        .details-box { background: #f8fafc; border-radius: 10px; padding: 12px; margin: 16px 0; text-align: left; font-size: 0.9rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>SGS BHOJPUR, DUMRAON</h1>
        <p>Best Institute of Science • Mr. Sonu Sir</p>
    </header>

    <div class="container">
        <!-- LOGIN SCREEN -->
        <div id="loginScreen" class="card">
            <h2 style="font-size: 1.15rem; font-weight: 800; margin-bottom: 14px; text-align: center;">विद्यार्थी विवरण (Student Info)</h2>
            <div class="form-group">
                <label>विद्यार्थी का नाम (FULL NAME) *</label>
                <input type="text" id="studentName" class="form-control" placeholder="उदा. Rahul Kumar">
            </div>
            <div class="form-group">
                <label>रोल नंबर (ROLL NO.) *</label>
                <input type="text" id="studentRoll" class="form-control" placeholder="उदा. 12">
            </div>

            <p style="font-size: 0.85rem; font-weight: 700; margin: 16px 0 10px; color: #64748b;">विषय चुनें (TAP TO START):</p>

            <button type="button" class="subject-btn" onclick="startQuiz('physics')">
                <div class="info">
                    <h3>भौतिकी (Physics)</h3>
                    <p>अध्याय 3: धारा विद्युत • 50 प्रश्न</p>
                </div>
                <div class="arrow">→</div>
            </button>

            <button type="button" class="subject-btn" onclick="startQuiz('english')">
                <div class="info">
                    <h3>English (100 Marks)</h3>
                    <p>Ch-3: A Pinch of Snuff • 50 Questions</p>
                </div>
                <div class="arrow">→</div>
            </button>

            <button type="button" class="subject-btn" onclick="startQuiz('math')">
                <div class="info">
                    <h3>गणित (Mathematics)</h3>
                    <p>आव्यूह (Matrices) • 50 प्रश्न</p>
                </div>
                <div class="arrow">→</div>
            </button>

            <button type="button" class="subject-btn" onclick="startQuiz('chemistry')">
                <div class="info">
                    <h3>रसायन विज्ञान (Chemistry)</h3>
                    <p>अध्याय 3: वैद्युतरसायन • 50 प्रश्न</p>
                </div>
                <div class="arrow">→</div>
            </button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quizScreen" class="card hidden">
            <div class="quiz-header">
                <span id="qCountText">प्रश्न: 1 / 50</span>
                <span id="timerText" style="color: #ef4444;">50:00</span>
            </div>
            <div class="progress-bar-wrap">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div id="qText" class="q-text"></div>
            <div id="optionsList"></div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="resultScreen" class="hidden">
            <div class="scorecard">
                <h3 style="color: #1e3a8a;">SGS BHOJPUR, DUMRAON</h3>
                <p style="font-size: 0.8rem; color: #64748b; font-weight: bold;">OFFICIAL RESULT SCORE CARD</p>
                <div class="score-circle" id="resScore">0</div>
                <div class="details-box">
                    <p><strong>नाम:</strong> <span id="resName"></span></p>
                    <p><strong>रोल नंबर:</strong> <span id="resRoll"></span></p>
                    <p><strong>विषय:</strong> <span id="resSubject"></span></p>
                    <p><strong>तारीख:</strong> <span id="resDate"></span></p>
                    <p><strong>प्रतिशत:</strong> <span id="resPerc"></span>%</p>
                </div>
                <p style="color: #059669; font-weight: bold;">📸 इस स्क्रीनशॉट को सर को भेजें।</p>
            </div>
        </div>
    </div>

    <script>
        const quizData = {

                {q:"3. ओम के नियम में V/I नियतांक को कहते हैं", o:["प्रतिरोधकता", "प्रतिरोध", "चालकता", "धारिता"], a:1},

                {q:"19. फ्यूज का तार बना होता है:", o:["टंगस्टन", "ताँबा", "टिन व सीसे की मिश्रधातु", "नाइक्रोम"], a:2},

                {q:"39. E1/E2 बराबर होता है:", o:["l1 × l2", "l2 / l1", "l1 / l2", "l1 - l2"], a:2},

                {q:"41. आदर्श अमीटर का प्रतिरोध:", o:["1 Ω", "100 Ω", "अनन्त", "शून्य"], a:3},
